app:
  name: "ResumeFit"
  version: "0.1.0"
  environment: "development"
  debug: false
  log_level: "INFO"
  log_format: "text"  # "text" in dev, "json" in prod
  secret_key: "dev-insecure-secret-key-change-in-production"
  rate_limit_analyze: "10 per minute"
  rate_limit_default: "30 per minute"

ingestion:
  min_chars_per_page: 50
  max_file_size_mb: 5
  max_pages: 10
  allowed_mime_types:
    - "application/pdf"
  non_english_ascii_ratio_threshold: 0.70
  max_garbled_token_ratio: 0.25

skills:
  esco_version: "v1.2.1"
  fuzzy_threshold: 0.70
  min_token_length: 3
  short_token_guard_tokens:
    - "c"
    - "r"
    - "go"
  stuffing_ratio_threshold: 3.0  # Listed-only to Demonstrated ratio
  max_uncorroborated_skills: 15

matching:
  alpha: 0.4  # Lexical weight (TF-IDF)
  beta: 0.6   # Semantic weight (Sentence-Transformers)
  embedding_model: "sentence-transformers/all-MiniLM-L6-v2"
  chunk_size_tokens: 200
  chunk_overlap_tokens: 30
  fusion_method: "weighted"  # "weighted" or "rrf"
  rrf_k: 60
  normalizer: "percentile"   # "percentile" or "minmax"
  cross_encoder_enabled: false
  cross_encoder_model: "cross-encoder/ms-marco-MiniLM-L-6-v2"
  section_weights:
    experience: 1.0
    projects: 0.9
    skills: 0.5
    certifications: 0.5
    education: 0.4
    summary: 0.3
    other: 0.2

constraints:
  mode: "soft"  # "soft" or "hard"
  min_years_penalty_per_year: 0.85
  missing_degree_penalty: 0.70
  missing_must_have_skill_penalty: 0.80

thresholds:
  semantic_strong: 0.70
  semantic_moderate: 0.45

database:
  url: "postgresql://resumefit:resumefit@localhost:5432/resumefit"
  pool_size: 5
  max_overflow: 10
  hnsw_m: 16
  hnsw_ef_construction: 64
  hnsw_ef_search: 40
