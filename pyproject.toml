[project]
name = "resumefit"
version = "0.1.0"
description = "Explainable Hybrid Resume-Job Matching System using Lexical and Semantic Retrieval"
readme = "README.md"
requires-python = ">=3.11,<3.12"
authors = [
    { name = "Shivam", email = "shivam@example.com" }
]
license = { text = "MIT" }
dependencies = [
    "flask>=3.0.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "pyyaml>=6.0.1",
    "python-json-logger>=2.0.7",
    "pypdf>=4.0.0",
    "pdfplumber>=0.11.0",
    "spacy>=3.7.0",
    "nltk>=3.8.1",
    "scikit-learn>=1.4.0",
    "sentence-transformers>=2.5.0",
    "rapidfuzz>=3.6.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "pgvector>=0.3.0",
    "psycopg2-binary>=2.9.9",
    "flask-limiter>=3.5.0",
    "gunicorn>=21.2.0",
    "faker>=24.0.0",
    "reportlab>=4.1.0",
    "requests>=2.31.0",
    "scipy>=1.12.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
    "types-pyyaml>=6.0.12",
    "types-requests>=2.31.0",
    "pre-commit>=3.6.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # line too long (handled by formatter)
]

[tool.mypy]
python_version = "3.11"
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true
disallow_untyped_defs = false
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
python_classes = ["Test*"]
addopts = "-v --strict-markers"
markers = [
    "unit: Unit tests",
    "integration: Integration tests (may require external services)",
    "golden: Golden-file tests comparing against pre-rendered fixtures",
]
