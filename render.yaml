# Render Blueprint specification for ResumeFit
# Reference: https://render.com/docs/blueprint-spec

version: "1"

services:
  # Web application service running Docker container
  - type: web
    name: resumefit-web
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    region: oregon
    numInstances: 1
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 5000
      - key: FLASK_ENV
        value: production
      - key: APP_CONFIG
        value: config/default.yaml
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: resumefit-postgres
          property: connectionString

databases:
  # Managed PostgreSQL instance with pgvector support
  - name: resumefit-postgres
    plan: starter
    region: oregon
    databaseName: resumefit
    user: resumefit
    ipAllowList: []
